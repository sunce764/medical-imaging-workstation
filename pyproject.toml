[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-imaging-workstation"
version = "0.1.0"
description = "Desktop CT imaging workstation (PySide6): clinical MPR viewer, from-scratch tomographic reconstruction lab, and AI multi-organ segmentation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary — All rights reserved" }
authors = [{ name = "Sheng Chao" }]
keywords = ["medical-imaging", "ct", "tomography", "reconstruction", "segmentation", "dicom", "pyside6"]

dependencies = [
    "PySide6>=6.11",
    "pydicom>=3.0",
    "numpy>=2.2",
    "scipy>=1.15",
    "scikit-image>=0.25",
    "onnxruntime>=1.23",
]

[project.scripts]
medical-imaging-workstation = "main:main"

[project.optional-dependencies]
# 量化研究复现（App 运行不需要）
experiments = ["matplotlib>=3.8", "nibabel>=5.0", "remotezip>=0.12"]
# 开发工具链
dev = ["ruff>=0.6", "coverage>=7.0"]

[tool.setuptools]
# 扁平模块布局（非 src/ 包）；显式列出以便 setuptools 正确打包
py-modules = [
    "main", "recon", "ai_engine", "constants", "graphics_view",
    "annotation_lab", "compare_lab", "interaction", "recon_lab", "ui_builder",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# 实验脚本与测试沿用较宽松风格；核心模块从严
extend-exclude = [".matrix_cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# 本库刻意采用紧凑单行风格（分号多语句、密集长行），非缺陷；故忽略纯排版类规则，
# 让 ruff 专注真问题（未用导入 F、bug 模式 B、导入排序 I 等）。
#   E501 长行 / E701,E702 一行多语句 —— 全库贯穿的既定风格
#   E741 单字母变量名（如 l）/ E731 lambda 赋值（测试里作事件工厂）—— 局部有意为之
#   UP031 printf 风格 %s —— 现存 %-格式化可用，不做机械现代化
ignore = ["E501", "E701", "E702", "E741", "E731", "UP031"]

[tool.ruff.lint.per-file-ignores]
"experiments/*.py" = ["E402"]  # sys.path.insert 后再 import 项目模块
"tests/*.py" = ["E402"]

[tool.coverage.run]
source = ["."]
# 排除测试/实验，以及 PySide6/shiboken 注入进程、伪装成 CWD 下路径的虚拟模块
omit = ["tests/*", "experiments/*", "*/site-packages/*", "pyscript", "shibokensupport/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# 忽略多进程 spawn 子进程等留下的、无法定位源文件的幽灵条目（如 recon 的矩阵并行 worker）
ignore_errors = true
