[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-imaging-workstation"
# V1.0 是软著提交的快照（2026-07-08，13 个模块）；工作树已刻意领先于它，
# 故不写 1.0.0——那会暗示当前代码就是被登记的那一版。
version = "1.1.0.dev0"
description = "Desktop CT imaging workstation (PySide6): clinical MPR viewer, a tomographic reconstruction lab whose DFR/DMR/ART/SIRT solvers and analytic phantom are written from first principles (Radon/FBP call scikit-image), and AI multi-organ segmentation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary — All rights reserved" }
authors = [{ name = "Sheng Chao" }]
keywords = ["medical-imaging", "ct", "tomography", "reconstruction", "segmentation", "dicom", "pyside6"]

dependencies = [
    "PySide6>=6.11",
    "pydicom>=3.0",
    "numpy>=2.2",
    "scipy>=1.15",
    "scikit-image>=0.25",
    "onnxruntime>=1.23",
]

[project.optional-dependencies]
# 【版本口径】本文件全篇用 >= 声明下界，不是锁版。确切锁版以 requirements.txt 与
# experiments/requirements-experiments.txt 为准（那里是 ==），已提交的 results/
# 由那些确切版本跑出——experiments 实测环境为 torch==2.11.0、onnx==1.21.0。
# 量化研究复现（App 运行不需要）
experiments = ["matplotlib>=3.8", "nibabel>=5.0", "remotezip>=0.12", "torch>=2.0", "onnx>=1.16"]
# 开发工具链
dev = ["ruff>=0.6", "coverage>=7.0"]
# 从 docs/manual_zh.md 生成说明书 PDF（另需本机 Google Chrome，见 docs/build_manual_pdf.py）
docs = ["markdown>=3"]

[tool.setuptools]
# 扁平模块布局。本 pyproject 用于项目元数据、依赖声明与工具配置（ruff/coverage）。
# 应用以脚本方式运行：`python main.py`（见 README）——非 pip 安装型 CLI：
# style.qss / models / 标签 JSON 等资源按源码树相对路径定位，未打进 wheel。
py-modules = [
    "main", "recon", "ai_engine", "constants", "graphics_view",
    "annotation_lab", "compare_lab", "interaction", "recon_lab", "ui_builder",
    "quantify", "segmentation", "mpr_geometry", "dicom_geometry",
    # 以下模块晚于软著 V1.0 快照；列表是当前 19-module worktree inventory，
    # 不是冻结登记 snapshot 的模块清单。
    "followup", "projection", "mesh3d", "registration", "model_card",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# 实验脚本与测试沿用较宽松风格；核心模块从严
extend-exclude = [".matrix_cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# 本库刻意采用紧凑单行风格（分号多语句、密集长行），非缺陷；故忽略纯排版类规则，
# 让 ruff 专注真问题（未用导入 F、bug 模式 B、导入排序 I 等）。
#   E501 长行 / E701,E702 一行多语句 —— 全库贯穿的既定风格
#   E741 单字母变量名（如 l）/ E731 lambda 赋值（测试里作事件工厂）—— 局部有意为之
#   UP031 printf 风格 %s —— 现存 %-格式化可用，不做机械现代化
ignore = ["E501", "E701", "E702", "E741", "E731", "UP031"]

[tool.ruff.lint.per-file-ignores]
"experiments/*.py" = ["E402"]  # sys.path.insert 后再 import 项目模块
"tests/*.py" = ["E402"]

[tool.coverage.run]
source = ["."]
# 排除测试/实验，以及 PySide6/shiboken 注入、伪装成 CWD 下路径的虚拟模块。
# `signature_bootstrap` 的 __file__ 只有相对名；coverage 会误解析成仓库根文件。
omit = [
    "tests/*", "experiments/*", "*/site-packages/*",
    "pyscript", "shibokensupport/*", "signature_bootstrap.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# 已知虚拟模块在 [tool.coverage.run].omit 中逐项排除；未知无源条目保持报错，
# 避免用 ignore_errors 把新的验证链问题一并吞掉。
