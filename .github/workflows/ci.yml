name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手动触发口子。注意这不只是「图个方便」：上面的 push 触发在本仓库**实际不生效**
  # ——多次向 main 推送均未产生 workflow run，至今每一次绿灯都来自手动
  # `gh workflow run ci.yml --ref main`。原因未查明（分支名、路径过滤、workflow 文件
  # 位置、Actions 权限均已排除）。后果是：**下一次提交后 badge 可能仍停在旧 SHA**，
  # 除非手动触发一次。读到这里的人请勿据 badge 推断最新提交已被 CI 覆盖。
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Ruff lint
        run: |
          python -m pip install --upgrade pip ruff
          ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # PySide6 离屏渲染所需的系统库（QT_QPA_PLATFORM=offscreen）
      - name: Install Qt offscreen system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'coverage[toml]'   # [toml] extra：Python 3.10 无 tomllib，读 pyproject 的 [tool.coverage] 需要它

      # CI 无真实患者数据 / 无 119MB 权重：SKIP_REAL_DATA=1 只跑数据无关的自包含测试
      # （合成 DICOM + /nonexistent.onnx 数学降级路径）。同时用 coverage 量化覆盖率。
      - name: Run regression tests (data-independent subset)
        env:
          QT_QPA_PLATFORM: offscreen
          SKIP_REAL_DATA: "1"
        run: |
          coverage run tests/test_gui.py
          coverage report
